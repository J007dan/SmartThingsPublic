<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="And then …? — modern timeline logo lockup">
  <title>And then …? — Modern Minimalist &amp; Timeline</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
    .o2 .serif { font-family:'Playfair Display', Georgia, 'Times New Roman', serif; }
    .o2 .sans  { font-family:'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .o2 .word  { font-size:64px; font-weight:600; fill:#1A1D20; letter-spacing:-1.6px; }
    .o2 .qm    { font-size:60px; font-weight:500; fill:#B9381E; }
    .o2 .eyebrow { font-size:11px; font-weight:600; fill:#5A6578; letter-spacing:4px; }
    .o2 .daylab  { font-size:10px; font-weight:600; letter-spacing:1.6px; }
    .o2 .caption { font-size:10px; font-weight:500; fill:#5A6578; letter-spacing:2px; }
  </style>
  <g class="o2">
    <rect width="800" height="600" fill="#F8F9FA"/>

    <!-- ICON: fourteen ticks. Day 0 charcoal, day 14 crimson, the twelve between recede. -->
    <g id="mark2" transform="translate(400,138)">
      <line x1="-130.00" y1="-15" x2="-130.00" y2="15" stroke="#1A1D20" stroke-width="3" stroke-linecap="round"/>
      <line x1="-110.00" y1="-5.5" x2="-110.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="-90.00" y1="-5.5" x2="-90.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="-70.00" y1="-5.5" x2="-70.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="-50.00" y1="-5.5" x2="-50.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="-30.00" y1="-5.5" x2="-30.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="-10.00" y1="-5.5" x2="-10.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="10.00" y1="-5.5" x2="10.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="30.00" y1="-5.5" x2="30.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="50.00" y1="-5.5" x2="50.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="70.00" y1="-5.5" x2="70.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="90.00" y1="-5.5" x2="90.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="110.00" y1="-5.5" x2="110.00" y2="5.5" stroke="#5A6578" stroke-width="1.6" stroke-linecap="round" opacity="0.45"/>
      <line x1="130.00" y1="-15" x2="130.00" y2="15" stroke="#B9381E" stroke-width="3" stroke-linecap="round"/>
      <text class="sans daylab" x="-130" y="34" text-anchor="middle" fill="#5A6578">DAY 0</text>
      <text class="sans daylab" x="130" y="34" text-anchor="middle" fill="#B9381E">DAY 14</text>
    </g>

    <!-- LOCKUP: geometric sans, with the one serif note reserved for the question mark -->
    <g id="lock2" transform="translate(0.75,0)">
      <text id="l2w" class="sans word" x="214" y="290">And then</text>
      <rect x="502" y="282" width="8" height="8" fill="#5A6578" opacity="0.5"/>
      <rect x="518" y="282" width="8" height="8" fill="#5A6578" opacity="0.75"/>
      <rect x="534" y="282" width="8" height="8" fill="#1A1D20"/>
      <text id="l2q" class="serif qm" x="556" y="290">?</text>
    </g>

    <text class="sans eyebrow" x="400" y="352" text-anchor="middle">FOURTEEN DAYS LATER</text>

    <line x1="150" y1="416" x2="650" y2="416" stroke="#DFE2E5" stroke-width="1"/>

    <!-- small-size proofs: the mark reduces to three ticks -->
    <g transform="translate(190,474)">
      <g>
        <line x1="-22" y1="-11" x2="-22" y2="11" stroke="#1A1D20" stroke-width="3" stroke-linecap="round"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#5A6578" stroke-width="2" stroke-linecap="round" opacity="0.45"/>
        <line x1="22" y1="-11" x2="22" y2="11" stroke="#B9381E" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text class="sans caption" x="0" y="46" text-anchor="middle">REDUCED MARK</text>
    </g>
    <g transform="translate(316,474)">
      <g transform="scale(0.5)">
        <line x1="-22" y1="-11" x2="-22" y2="11" stroke="#1A1D20" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#5A6578" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="22" y1="-11" x2="22" y2="11" stroke="#B9381E" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text class="sans caption" x="0" y="46" text-anchor="middle">24 PX</text>
    </g>
    <g id="hz2" transform="translate(396,466)">
      <g transform="scale(0.62)">
        <line x1="-22" y1="-11" x2="-22" y2="11" stroke="#1A1D20" stroke-width="4" stroke-linecap="round"/>
        <line x1="0" y1="-4" x2="0" y2="4" stroke="#5A6578" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
        <line x1="22" y1="-11" x2="22" y2="11" stroke="#B9381E" stroke-width="4" stroke-linecap="round"/>
      </g>
      <text id="h2w" class="sans" x="30" y="9" font-size="27" font-weight="600" fill="#1A1D20" letter-spacing="-0.7">And then</text>
      <rect x="150" y="0" width="4" height="4" fill="#5A6578" opacity="0.5"/>
      <rect x="158" y="0" width="4" height="4" fill="#5A6578" opacity="0.75"/>
      <rect x="166" y="0" width="4" height="4" fill="#1A1D20"/>
      <text class="serif" x="177" y="9" font-size="29" font-weight="500" fill="#B9381E">?</text>
      <text class="sans caption" x="98" y="46" text-anchor="middle">HORIZONTAL LOCKUP</text>
    </g>
  </g>
</svg>
