<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="And then …? — classic editorial logo lockup">
  <title>And then …? — Classic Editorial</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap');
    .o1 { --ink:#1A1D20; --slate:#5A6578; --accent:#B9381E; --paper:#F4F4F2; }
    .o1 .serif { font-family:'Playfair Display', Georgia, 'Times New Roman', serif; }
    .o1 .sans  { font-family:'Inter', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .o1 .word  { font-size:76px; font-weight:400; fill:#1A1D20; }
    .o1 .qm    { font-size:76px; font-weight:500; fill:#B9381E; }
    .o1 .eyebrow { font-size:12px; font-weight:500; fill:#5A6578; letter-spacing:3.4px; }
    .o1 .caption { font-size:10px; font-weight:500; fill:#5A6578; letter-spacing:2px; }
    .o1 .rule-hi { stroke:#1A1D20; stroke-width:2.5; }
    .o1 .rule-lo { stroke:#1A1D20; stroke-width:1; }
    .o1 .hair    { stroke:#C9CAC6; stroke-width:1; }
  </style>
  <g class="o1">
    <rect width="800" height="600" fill="#F4F4F2"/>

    <!-- ICON: the ellipsis, set between classic newspaper section rules -->
    <g id="mark1" transform="translate(400,132)">
      <line class="rule-hi" x1="-54" y1="-24" x2="54" y2="-24"/>
      <line class="rule-lo" x1="-54" y1="-17" x2="54" y2="-17"/>
      <circle cx="-20" cy="2" r="5" fill="#1A1D20"/>
      <circle cx="0"   cy="2" r="5" fill="#1A1D20"/>
      <circle cx="20"  cy="2" r="5" fill="#B9381E"/>
      <line class="rule-lo" x1="-54" y1="22" x2="54" y2="22"/>
    </g>

        <!-- LOCKUP: ellipsis drawn as circles so its rhythm is set optically, not by font metrics -->
    <g id="lock1" transform="translate(-12.6,0)">
      <text id="l1w" class="serif word" x="196" y="300">And then</text>
      <circle cx="529" cy="294" r="5.4" fill="#1A1D20"/>
      <circle cx="551" cy="294" r="5.4" fill="#1A1D20"/>
      <circle cx="573" cy="294" r="5.4" fill="#1A1D20"/>
      <text id="l1q" class="serif qm" x="594" y="300">?</text>
    </g>

    <text class="sans eyebrow" x="400" y="374" text-anchor="middle">EST. FOURTEEN DAYS AGO</text>

    <line class="hair" x1="150" y1="428" x2="650" y2="428"/>

    <!-- small-size proofs -->
    <g transform="translate(178,470)">
      <g transform="scale(0.44)">
        <line class="rule-hi" x1="-54" y1="-24" x2="54" y2="-24"/>
        <line class="rule-lo" x1="-54" y1="-17" x2="54" y2="-17"/>
        <circle cx="-20" cy="2" r="5" fill="#1A1D20"/><circle cx="0" cy="2" r="5" fill="#1A1D20"/><circle cx="20" cy="2" r="5" fill="#B9381E"/>
        <line class="rule-lo" x1="-54" y1="22" x2="54" y2="22"/>
      </g>
      <text class="sans caption" x="0" y="52" text-anchor="middle">48 PX</text>
    </g>
    <g transform="translate(286,470)">
      <g transform="scale(0.26)">
        <line class="rule-hi" x1="-54" y1="-24" x2="54" y2="-24"/>
        <line class="rule-lo" x1="-54" y1="-17" x2="54" y2="-17"/>
        <circle cx="-20" cy="2" r="5" fill="#1A1D20"/><circle cx="0" cy="2" r="5" fill="#1A1D20"/><circle cx="20" cy="2" r="5" fill="#B9381E"/>
        <line class="rule-lo" x1="-54" y1="22" x2="54" y2="22"/>
      </g>
      <text class="sans caption" x="0" y="52" text-anchor="middle">28 PX</text>
    </g>
    <g id="hz1" transform="translate(356,458)">
      <g transform="scale(0.3)">
        <line class="rule-hi" x1="-54" y1="-24" x2="54" y2="-24"/>
        <line class="rule-lo" x1="-54" y1="-17" x2="54" y2="-17"/>
        <circle cx="-20" cy="2" r="5" fill="#1A1D20"/><circle cx="0" cy="2" r="5" fill="#1A1D20"/><circle cx="20" cy="2" r="5" fill="#B9381E"/>
        <line class="rule-lo" x1="-54" y1="22" x2="54" y2="22"/>
      </g>
      <text id="h1w" class="serif" x="40" y="10" font-size="30" font-weight="400" fill="#1A1D20">And then</text>
      <circle cx="173" cy="4" r="2.2" fill="#1A1D20"/><circle cx="182" cy="4" r="2.2" fill="#1A1D20"/><circle cx="191" cy="4" r="2.2" fill="#1A1D20"/>
      <text class="serif" x="199" y="10" font-size="30" font-weight="500" fill="#B9381E">?</text>
      <text class="sans caption" x="105" y="52" text-anchor="middle">HORIZONTAL LOCKUP</text>
    </g>
  </g>
</svg>
