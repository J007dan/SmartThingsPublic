name: Build today's edition

# Researches the news from exactly fourteen days ago and opens a PR with the
# result. Nothing publishes without a human merging it — the review gate is the
# point, because the pipeline is doing journalism and can be wrong.

on:
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC — early morning in the US
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Defaults to today.'
        required: false
        type: string

concurrency:
  group: edition
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: and-then-what-happened

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: and-then-what-happened/package-lock.json

      - run: npm ci

      - name: Check the loop before spending an API call on it
        run: node pipeline/test-loop.mjs

      - name: Research and write the edition
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node pipeline/build-edition.mjs --date "${{ inputs.date }}"
          else
            node pipeline/build-edition.mjs
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # a new edition is an untracked file plus a modified index, so ask status
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "No new edition — nothing to open a PR for."
            exit 0
          fi

          DATE="${{ inputs.date }}"
          DATE="${DATE:-$(date -u +%F)}"
          BRANCH="edition/$DATE"
          NEWS_DATE=$(date -u -d "$DATE - 14 days" +%F)

          git config user.name  "and-then-what-happened"
          git config user.email "noreply@github.com"

          git checkout -b "$BRANCH"
          git add data
          git commit -m "Edition of $DATE — the news of $NEWS_DATE"
          git push -u origin "$BRANCH"

          node pipeline/pr-body.mjs "$DATE" > /tmp/pr-body.md

          gh pr create \
            --title "Edition of $DATE — the news of $NEWS_DATE" \
            --body-file /tmp/pr-body.md
